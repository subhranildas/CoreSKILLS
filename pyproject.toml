[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coreskills"
version = "0.1.0"
description = "Validated interactive workflow lifecycle tools for CoreSKILLS"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
coreskills = "coreskills.cli:main"

[tool.setuptools]
packages = ["coreskills"]
